[project]
name = "foodflow"
version = "0.1.0"
description = "FoodFlow - production-oriented food delivery platform (project scaffolding only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "Django>=5.1,<7.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.1",
    "channels>=4.1",
    "channels-redis>=4.2",
    "celery>=5.4",
    "redis>=5.0",
    "drf-spectacular>=0.27",
    "django-filter>=24.2",
    "djangorestframework-simplejwt>=5.3",
    "google-auth>=2.0",
    "requests>=2.31",
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests", "apps"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
