name: foodflow

# Shared env for Django/Celery containers.
# - Container-networking values are HARDCODED: the local `.env` file is for
#   `manage.py`/pytest runs (sqlite/localhost) and must never leak into
#   containers (Compose interpolates `./.env` into `${...}` expressions).
# - Tunables below stay interpolated: override via shell env or `.env.docker`.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DATABASE_URL: postgres://foodflow:foodflow@db:5432/foodflow
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  SECURE_SSL_REDIRECT: "False"
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: foodflow
  POSTGRES_USER: foodflow
  REDIS_HOST: redis
  REDIS_PORT: 6379
  SECRET_KEY: ${SECRET_KEY:-django-insecure-foodflow-docker-local-only}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,0.0.0.0}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      # Hardcoded to match DATABASE_URL above; change both together.
      POSTGRES_PASSWORD: foodflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d foodflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - path: .env.docker
        required: false
    environment: *app-env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$${HOSTNAME} | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - path: .env.docker
        required: false
    environment: *app-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/app/celerybeat/celerybeat-schedule"]
    healthcheck:
      disable: true
    env_file:
      - path: .env.docker
        required: false
    environment: *app-env
    volumes:
      - celery_beat_data:/app/celerybeat
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  celery_beat_data:
